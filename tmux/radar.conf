# ==========================================================
# Claude radar: pestañas tarjeta (2 líneas) + barra de título por pane
# + mission control (prefix a). Scripts en scripts/radar/.
# Para desactivar: comentar el source-file de radar.conf en tmux.conf.
# ==========================================================

# ---- Barra inferior (2026-11-23): una línea tenue, PRs a la izquierda ----
# Los agentes y servidores viven en el panel de workmux (radar.py → wm_sync).
# El #(radar-scan) no imprime nada: solo dispara el escáner cada status-interval.
set -g status on
set -g status-position bottom
set -g status-interval 2
set -g status-style "bg=#2e2e2e,fg=#8a8a8a"  # mismo gris que los encabezados de workmux
set -gu status-format[1]
set -gu status-format[2]
set -g status-format[0] '#[bg=#2e2e2e]#{@prt_sum}#[align=right]#(~/.config/tmux/scripts/radar/radar-scan)#{?pane_in_mode,#[fg=#e8a33d bold]COPY #[nobold],}#{?window_zoomed_flag,#[fg=#5fb3dc]ZOOM ,}#(~/.config/tmux/scripts/radar/prt-tick)#[fg=#5c5c5c] · #{?client_prefix,#[fg=#111111 bg=#e8a33d bold] #S #[bg=#2e2e2e nobold],#[fg=#e8a33d]#S}#[fg=#8a8a8a] · #I #W · %H:%M '

# ---- Barra de título por pane (solo en ventanas con 2+ panes; lo decide el escáner) ----
set -g pane-border-status off
set -g pane-border-lines heavy
set -g pane-border-format '#{?@pane_bar,#{@pane_bar},#[fg=#4a4a4a] #{pane_current_command} }'
set -g pane-border-style "fg=#2d2d2d"
set -g pane-active-border-style "fg=#f2f2f2"
# Atenuar el texto de los panes inactivos
set -g window-style "fg=#7a7a7a"
set -g window-active-style "fg=default"

# ---- Refresco inmediato al moverse (índice fijo: no se duplica al recargar) ----
set-hook -g after-select-window[10] 'run-shell -b "~/.config/tmux/scripts/radar/radar-scan"'
set-hook -g after-select-pane[10] 'run-shell -b "~/.config/tmux/scripts/radar/radar-scan"'
set-hook -g client-session-changed[10] 'run-shell -b "~/.config/tmux/scripts/radar/radar-scan"'
set-hook -g after-new-window[10] 'run-shell -b "~/.config/tmux/scripts/radar/radar-scan"'
set-hook -g after-split-window[10] 'run-shell -b "~/.config/tmux/scripts/radar/radar-scan"'
set-hook -g after-kill-pane[10] 'run-shell -b "~/.config/tmux/scripts/radar/radar-scan"'
set-hook -g pane-exited[10] 'run-shell -b "~/.config/tmux/scripts/radar/radar-scan"'
set-hook -g client-resized[10] 'run-shell -b "~/.config/tmux/scripts/radar/radar-scan"'

# ---- Administrador de tareas (prefix M): CPU/RAM/temperatura por sesión, arnés, app y Docker ----
bind M display-popup -E -w 94% -h 92% -b rounded -S "fg=#4d4d4d" "/opt/homebrew/bin/uv run --quiet --script ~/.config/tmux/scripts/radar/taskmon.py"

# ---- Mission control ----
bind a display-popup -E -w 94% -h 92% -b rounded -S "fg=#4d4d4d" "/opt/homebrew/bin/uv run --quiet --script ~/.config/tmux/scripts/radar/mission.py"

# ---- Barra lateral (prefix b): árbol fijo a la derecha que te sigue de ventana ----
bind b run-shell -b "~/.config/tmux/scripts/radar/radar-sidebar.sh toggle '#{window_id}'"
# prefix P: abre la barra en "Mis PRs" con el foco · Alt-p: foco a la barra · Esc (en la barra): regresa
bind P run-shell -b "~/.config/tmux/scripts/radar/radar-sidebar.sh prs '#{window_id}'"
bind -n M-p run-shell -b "~/.config/tmux/scripts/radar/radar-sidebar.sh focus"
set-hook -g after-select-window[11] 'run-shell -b "~/.config/tmux/scripts/radar/radar-sidebar.sh follow #{window_id}"'
set-hook -g client-session-changed[11] 'run-shell -b "~/.config/tmux/scripts/radar/radar-sidebar.sh follow"'
set-hook -g after-new-window[11] 'run-shell -b "~/.config/tmux/scripts/radar/radar-sidebar.sh follow #{window_id}"'
set-hook -g pane-exited[11] 'run-shell -b "~/.config/tmux/scripts/radar/radar-sidebar.sh follow"'
set-hook -g after-kill-pane[11] 'run-shell -b "~/.config/tmux/scripts/radar/radar-sidebar.sh follow"'

# ── workmux (2026-11-23) ────────────────────────────────────────────
# prefix W → dashboard de agentes (popup) · prefix T → sidebar de agentes
bind W display-popup -E -w 90% -h 85% -b rounded "workmux dashboard"
bind T run-shell -b "workmux sidebar"
# El panel de workmux es la vista principal: encenderlo al arrancar/recargar (idempotente)
run-shell -b "workmux sidebar on"
# prefix n → ventana nueva en el path actual con el arnés de esa carpeta (~/.config/harness/map.conf)
# (antes: next-window)
bind n run-shell -b "~/.config/tmux/scripts/new-agent-window.sh '#{pane_current_path}'"

# ── Cerrar sin dejar procesos vivos (2026-11-23) ────────────────────
# Cierra Claude con SIGTERM (guarda y apaga sus MCP), luego el pane/ventana/sesión,
# y mata lo que quede del árbol de procesos. scripts/close-agent.py
# prefix x → pane (pide confirmación solo si hay un Claude corriendo en él)
bind x if -F '#{m/r:^([0-9]+\.[0-9]+\.[0-9]+|claude)$,#{pane_current_command}}' \
  'confirm-before -p "¿Cerrar este Claude y su pane? (y/n)" "run-shell -b \"~/.config/tmux/scripts/close-agent.py pane #{pane_id}\""' \
  'run-shell -b "~/.config/tmux/scripts/close-agent.py pane #{pane_id}"'
# prefix X → ventana completa
bind X confirm-before -p "¿Cerrar la ventana #W y todo lo que corre en ella? (y/n)" 'run-shell -b "~/.config/tmux/scripts/close-agent.py window #{window_id}"'
# prefix K → sesión completa
bind K confirm-before -p "¿Cerrar la sesión #S y todo lo que corre en ella? (y/n)" 'run-shell -b "~/.config/tmux/scripts/close-agent.py session #{session_id}"'
